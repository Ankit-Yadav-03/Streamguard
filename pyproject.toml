[project]
name = "streamguard"
version = "0.1.0"
description = "Self-hosted LLM streaming control plane with cancellation, backpressure, and cost receipts"
authors = [
    { name = "Ankit Yadav", email = "ankit.ydv989@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.23",
    "opentelemetry-sdk>=1.23",
    "aiohttp>=3.9",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"